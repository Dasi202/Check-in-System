version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: meridian-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    container_name: meridian-app
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WEBHOOK_URL=http://app:3000/api/webhook/print-complete
      - WEBHOOK_SECRET=your-super-secret-key
    depends_on:
      - redis
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests

volumes:
  redis-data: